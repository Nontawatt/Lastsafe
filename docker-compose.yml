version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lastsafe-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - backup-cache:/root/.cache/restic
    environment:
      - GIN_MODE=release
      - DATABASE_PATH=/app/data/lastsafe.db
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-changeme}
    networks:
      - lastsafe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lastsafe-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - lastsafe-network

networks:
  lastsafe-network:
    driver: bridge

volumes:
  backup-cache:
